spring.application.name=raf-ispiti-server
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raf_ispiti?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.storage.dir=${STORAGE_DIR:./podaci/fajlovi}

app.jwt.secret=${JWT_SECRET:razvojni-kljuc-raf-ispiti}
app.jwt.trajanje=${JWT_TRAJANJE:8h}
app.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
